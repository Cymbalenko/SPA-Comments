<mat-card>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill" class="full">
      <mat-label>User Name</mat-label>
      <input matInput formControlName="userName">
      <mat-error *ngIf="form.controls['userName'].hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
      <mat-error *ngIf="form.controls['email'].invalid">Invalid email</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full">
      <mat-label>Home page (optional)</mat-label>
      <input matInput formControlName="homePage">
    </mat-form-field>

    <div class="toolbar">
      <button type="button" mat-mini-fab color="primary" (click)="insertTag('strong')"><b>B</b></button>
      <button type="button" mat-mini-fab color="primary" (click)="insertTag('i')"><i>I</i></button>
      <button type="button" mat-mini-fab color="primary" (click)="insertTag('code')"><code>c</code></button>
      <button type="button" mat-mini-fab color="primary" (click)="insertTag('a')">link</button>
      <button type="button" mat-mini-fab (click)="preview()">Preview</button>
    </div>

    <mat-form-field appearance="fill" class="full">
      <mat-label>Text</mat-label>
      <textarea id="comment-text" matInput rows="6" formControlName="text"></textarea>
      <mat-error *ngIf="form.controls['text'].invalid">Enter comment text</mat-error>
    </mat-form-field>

    <div class="file-section">
      <input type="file" id="file" (change)="onFileSelected($event)" multiple accept=".txt,image/png,image/jpeg,image/gif" />
      <div class="previews">
        <div *ngFor="let f of previewFiles; let i = index" class="preview">
          <div *ngIf="f.type === 'image'">
            <img [src]="f.url" alt="{{f.name}}" (click)="$event.preventDefault()" />
          </div>
          <div *ngIf="f.type === 'text'">
            <pre>{{ f.url }}</pre>
          </div>
          <button mat-mini-button color="warn" (click)="removePreview(i)">Remove</button>
        </div>
      </div>
    </div>

    <div class="captcha">
      <img [src]="captchaUrl" alt="captcha" />
      <button mat-button type="button" (click)="refreshCaptcha()">Refresh</button>
      <mat-form-field appearance="fill">
        <mat-label>Captcha</mat-label>
        <input matInput formControlName="captcha">
      </mat-form-field>
    </div>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="uploading">Send</button>
    </div>
  </form>

  <div *ngIf="previewHtml" class="preview-block">
    <h3>Preview</h3>
    <div [innerHTML]="previewHtml"></div>
  </div>
</mat-card>
