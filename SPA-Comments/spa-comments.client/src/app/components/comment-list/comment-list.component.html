<mat-card>
  <mat-card-title>Comments</mat-card-title>

  <div *ngIf="isLoading" class="loading">Loading...</div>
  <div *ngIf="errorMsg" class="error">{{ errorMsg }}</div>

  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    <!-- User Name Column -->
    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> User Name </th>
      <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <!-- CreatedAt Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
      <td mat-cell *matCellDef="let element"> {{element.createdAt | date:'short'}} </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-mini-button color="primary" (click)="toggleReplies(element)">
          {{ element.showReplies ? 'Hide' : 'Show' }} replies ({{element.childrenCount || 0}})
        </button>
        <button mat-mini-button color="accent" (click)="showReplyForm(element)">Reply</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="comment-row"></tr>
  </table>

  <mat-paginator [length]="total" [pageSize]="pageSize" [pageSizeOptions]="[25]" showFirstLastButtons></mat-paginator>

  <div *ngFor="let item of dataSource.data" class="replies">
    <app-comment-item *ngIf="item.showReplies" [comment]="item" (refresh)="onReplyAdded()"></app-comment-item>
  </div>

  <!-- Add Comment Form -->
  <mat-card>
    <mat-card-title>Add a new comment</mat-card-title>
    <app-comment-form (submitted)="onCommentSubmitted()"></app-comment-form>
  </mat-card>
</mat-card>
