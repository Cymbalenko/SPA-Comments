<mat-card class="comments-container">
  <mat-card-title>Комментарии</mat-card-title>

  <div *ngIf="isLoading" class="loading">Загрузка...</div>
  <div *ngIf="errorMsg" class="error">{{ errorMsg }}</div>

  <table mat-table
         [dataSource]="dataSource"
         matSort
         (matSortChange)="onSortChange($event)"
         class="mat-elevation-z8 full-width-table">
    <!-- Expand icon -->
    <ng-container matColumnDef="expand">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button
                (click)="onRowClick(element); $event.stopPropagation()">
          <mat-icon>
            {{ selectedComment === element ? 'expand_less' : 'expand_more' }}
          </mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- User -->
    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="userName">
        Пользователь
      </th>
      <td mat-cell *matCellDef="let element">{{ element.userName }}</td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="email">Email</th>
      <td mat-cell *matCellDef="let element">{{ element.email }}</td>
    </ng-container>

    <!-- Date -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="createdAt">
        Дата
      </th>
      <td mat-cell *matCellDef="let element">
        {{ element.createdAt | date:'dd.MM.yyyy HH:mm' }}
      </td>
    </ng-container>

    <!-- Text preview -->
    <ng-container matColumnDef="text">
      <th mat-header-cell *matHeaderCellDef>Комментарий</th>
      <td mat-cell
          *matCellDef="let element"
          (click)="onRowClick(element)">
        <div class="comment-preview" [innerHTML]="getCommentPreview(element.text)"></div>
      </td>
    </ng-container>


    <!-- Header & Data rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="data-row"
        [class.selected-row]="selectedComment === row"></tr>
  </table>
  <mat-paginator #paginator
                 [length]="total"
                 [pageSize]="pageSize"
                 [pageSizeOptions]="[25]"
                 showFirstLastButtons></mat-paginator>

  <!-- ПАНЕЛЬ ПОД ТАБЛИЦЕЙ -->
  <div class="detail-panel"
       *ngIf="selectedComment"
       [@fadeExpandAnimation]>
    <app-comment-item [comment]="selectedComment"
                      (refresh)="onReplySubmitted($event)"></app-comment-item>
  </div>

</mat-card>

<!-- Новый комментарий -->
<mat-card>
  <button mat-raised-button
          color="primary"
          (click)="showNewCommentForm = !showNewCommentForm">
    Добавить новый комментарий
  </button>

  <div *ngIf="showNewCommentForm">
    <app-comment-form (submitted)="reload()"></app-comment-form>
  </div>
</mat-card>
