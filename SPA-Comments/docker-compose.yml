version: '3.9'

services:
  # 🟥 MSSQL
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      SA_PASSWORD: "Passw0rd1"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes: 
      - mssql_data:/var/opt/mssql
    networks:
      - spa_net
    mem_limit: 4g 

  # 🟦 ASP.NET + Angular приложение
  spa-comments:
    container_name: spa-comments
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mssql;Database=CommentsDb;User Id=sa;Password=Passw0rd1;TrustServerCertificate=True;Encrypt=False
      - RabbitMQ__Host=rabbitmq
      - ElasticSearch__Url=http://elasticsearch:9200
    depends_on:
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_started 
      mssql:
        condition: service_started 
    networks:
      - spa_net

  # 🟩 RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - spa_net

  # 🟨 Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    networks:
      - spa_net

  # 🟧 Kibana (для удобного просмотра индексов)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - spa_net

volumes:
  mssql_data:

networks:
  spa_net:
    driver: bridge
